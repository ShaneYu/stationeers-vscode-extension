name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy,rustfmt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: python -m unittest discover -s tools/stationpedia/tests -v
      - run: cargo build -p ic10-lsp
      - run: python tools/smoke_lsp.py
      - run: npm run check --workspace stationeers-ic10
      - run: npm run build --workspace stationeers-ic10
