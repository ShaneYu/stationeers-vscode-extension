name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: marketplace-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.90.0
          components: clippy,rustfmt

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify signed release tag on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.type')"
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.sha')"
          test "$tag_type" = "tag"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.verification.verified')" = "true"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"

      - name: Verify tag and package versions
        run: npm run release:check -- "${{ github.ref_name }}"

      - name: Check formatting and static analysis
        run: npm run check

      - name: Run tests
        run: npm test

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: win32-x64
            server: target/release/ic10-lsp.exe
            dap: target/release/ic10-dap.exe
          - runner: windows-11-arm
            target: win32-arm64
            server: target/release/ic10-lsp.exe
            dap: target/release/ic10-dap.exe
          - runner: ubuntu-24.04
            target: linux-x64
            server: target/release/ic10-lsp
            dap: target/release/ic10-dap
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            server: target/release/ic10-lsp
            dap: target/release/ic10-dap
          - runner: macos-15-intel
            target: darwin-x64
            server: target/release/ic10-lsp
            dap: target/release/ic10-dap
          - runner: macos-15
            target: darwin-arm64
            server: target/release/ic10-lsp
            dap: target/release/ic10-dap
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.90
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.90.0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build platform VSIX
        run: npm run package:extension

      - name: Smoke-test native language server
        run: python tools/smoke_lsp.py "${{ matrix.server }}"

      - name: Smoke-test native debug adapter
        run: python tools/smoke_dap.py "${{ matrix.dap }}"

      - name: Inspect VSIX contents
        run: python tools/verify_vsix.py "packages/vscode/*@${{ matrix.target }}.vsix" "${{ matrix.target }}"

      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix-${{ matrix.target }}
          path: packages/vscode/*@${{ matrix.target }}.vsix
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish marketplaces
    needs: build
    runs-on: ubuntu-24.04
    environment: marketplace-production
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install publishing tools
        run: npm ci

      - name: Download all platform packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: vsix-*
          path: release
          merge-multiple: true

      - name: Create SHA-256 checksums
        run: sha256sum release/*.vsix > release/SHA256SUMS

      - name: Require third-party content approval
        env:
          THIRD_PARTY_CONTENT_APPROVED: ${{ vars.THIRD_PARTY_CONTENT_APPROVED }}
        run: test "$THIRD_PARTY_CONTENT_APPROVED" = "true"

      - name: Attest VSIX build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: release/*.vsix

      - name: Publish to Visual Studio Marketplace
        if: ${{ vars.PUBLISH_TO_MARKETPLACE == 'true' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          shopt -s nullglob
          vsix_files=("$GITHUB_WORKSPACE"/release/*.vsix)
          if ((${#vsix_files[@]} == 0)); then
            echo "::error::No VSIX packages were downloaded into $GITHUB_WORKSPACE/release"
            exit 1
          fi
          npm exec --workspace packages/vscode -- vsce publish --skip-duplicate --packagePath "${vsix_files[@]}"

      - name: Publish to Open VSX
        if: ${{ vars.PUBLISH_TO_OPENVSX == 'true' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          shopt -s nullglob
          vsix_files=("$GITHUB_WORKSPACE"/release/*.vsix)
          if ((${#vsix_files[@]} == 0)); then
            echo "::error::No VSIX packages were downloaded into $GITHUB_WORKSPACE/release"
            exit 1
          fi
          npm exec --workspace packages/vscode -- ovsx publish --pat "$OVSX_PAT" --skip-duplicate --packagePath "${vsix_files[@]}"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.vsix release/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.vsix release/SHA256SUMS --verify-tag --generate-notes
          fi
