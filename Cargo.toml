[workspace]
members = [
    "crates/ic10-build",
    "crates/ic10-core",
    "crates/ic10-dap",
    "crates/ic10-data",
    "crates/ic10-lsp",
    "crates/ic10-runner",
    "crates/ic10-sim",
]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/ShaneYu/stationeers-vscode-extension"
license = "MIT"

[workspace.dependencies]
ic10-build = { path = "crates/ic10-build" }
ic10-core = { path = "crates/ic10-core" }
ic10-data = { path = "crates/ic10-data" }
ic10-runner = { path = "crates/ic10-runner" }
ic10-sim = { path = "crates/ic10-sim" }
mlua = { version = "=0.12.0", default-features = false, features = ["lua52", "vendored"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = [
  "io-std",
  "macros",
  "rt-multi-thread",
  "sync",
] }
tower-lsp = "0.20.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
